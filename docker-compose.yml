services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: docker
      LOG_LEVEL: INFO
      DATABASE_PATH: /app/data/app.db
      CHROMA_PERSIST_DIR: /app/data/chroma_db
    ports:
      - "8001:8001"
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8001/api
    depends_on:
      - backend
    ports:
      - "5173:80"
